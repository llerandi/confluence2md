# Requirements:
#   - Self-hosted runner with network access to your Confluence instance
#   - Secret CONFLUENCE_PAT (Settings -> Secrets and variables -> Actions)
#   - Variable CONFLUENCE_BASE_URL (optional; inferred from the page URL if absent)

name: Confluence to Markdown

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: "Confluence page URL (or pageId)"
        required: true
      output_dir:
        description: "Target folder in the repo"
        required: false
        default: "docs"

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted]   # required: GitHub-hosted runners cannot reach the internal network
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Convert page
        env:
          CONFLUENCE_PAT: ${{ secrets.CONFLUENCE_PAT }}
          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
          PAGE_URL: ${{ inputs.page_url }}
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          python scripts/confluence2md.py "$PAGE_URL" -o "$OUTPUT_DIR"

      - name: Commit and push
        env:
          PAGE_URL: ${{ inputs.page_url }}
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          git config user.name "confluence-sync[bot]"
          git config user.email "actions@github.com"
          git add "$OUTPUT_DIR"
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "docs: sync from Confluence ($PAGE_URL)"
          git push
